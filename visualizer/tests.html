<!doctype html>
<html><head><meta charset="utf-8"><title>spider.js tests</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body><pre id="out">running…</pre>
<script type="module">
import { LOCKED, DEFAULTS, briefPreset, buildSpider, bodyLength, flatWalls, rootToFootDistance,
         lowerSegmentFor, solveFeetForLength, bendFactor, placeKnee, kneeParamsAt, footParamsAt,
         kneeFromBend, upgradeParams, legIndex, legOf, legsFromAngles, SPREAD_AZIMUTHS, planAngles, legAngles,
         solveLegFromKnee, solveLegFromFoot, rootAlongOffset } from './spider.js';
import { loadSite, wallsFromSite, insideBuilding } from './site.js';
import { HALLOWEEN_NOON, solarPosition, sunVector } from './sun.js';

const out = [];
let failed = 0;
function check(name, cond, detail = '') {
  out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  ' + detail));
  if (!cond) failed++;
}
const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
const leg = (m, pair, side) => m.legs.find(l => l.pair === pair && l.side === side);

try {
  // Locked ratios are consistent.
  check('segments sum to 1', near(LOCKED.headLength + LOCKED.abdomenLength, 1));
  check('head is 0.66 of abdomen width', near(LOCKED.headWidth / LOCKED.abdomenWidth, 0.66, 0.002));

  // Brief preset at L = 0.8 reproduces the ratios.
  const L = 0.8;
  const p = briefPreset(L);
  check('preset body length', near(bodyLength(p), L));
  check('preset abdomen', near(p.abdomenLength, 0.76 * L) && near(p.abdomenWidth, 0.494 * L) && near(p.abdomenHeight, 0.494 * L));
  check('preset head', near(p.headLength, 0.24 * L) && near(p.headWidth, 0.326 * L));
  check('bend factors', near(bendFactor(0), 0.5) && near(bendFactor(3), 1));
  check('preset legs are points', p.legs.length === 8 && p.legs.every(q => ['footAlong', 'footHeight', 'kneeAlong', 'kneeHeight', 'kneeOut'].every(k => Number.isFinite(q[k]))));
  check('preset is mirrored', [0, 1, 2, 3].every(i => JSON.stringify(legOf(p, i, 1)) === JSON.stringify(legOf(p, i, -1))));
  const withLeg = (base, pair, side, leg) => ({ ...base, legs: base.legs.map((q, j) => j === legIndex(pair, side) ? { ...q, ...leg } : q) });

  // Law of cosines round trip.
  const a = 1.248, b = 1.352;
  for (const bend of [0, 15, 60, 105, 140]) {
    const d = rootToFootDistance(a, b, bend);
    const b2 = lowerSegmentFor(a, d, bend);
    check(`lower segment recovered at ${bend}°`, b2 !== null && near(b2, b, 1e-9), String(b2));
  }
  check('infeasible foot gives null', lowerSegmentFor(1.0, 0.5, 30) === null);
  const fold = placeKnee([0, 0, 0], [0.5, 0, 0], 1.0, 30);
  check('too-close foot folds the leg flat', fold.folded && near(dist(fold.knee, [0, 0, 0]), 1.0, 1e-9));

  // Flat walls: feet on the walls, segment lengths as the brief, knees
  // lifted, bends as chosen (the preset rounds its points to the mm).
  const walls = flatWalls(2.94); // the preset places its feet for a 2.94 m alley
  const m = buildSpider(p, walls);
  const aBrief = LOCKED.legLength * L * LOCKED.kneeFraction, bBrief = LOCKED.legLength * L - aBrief;
  check('8 legs', m.legs.length === 8);
  for (const l of m.legs) {
    const tag = `leg ${l.pair}${l.side > 0 ? 'R' : 'L'}`;
    check(`${tag} foot on wall`, near(Math.abs(l.foot[2]), 1.47));
    check(`${tag} upper length`, near(dist(l.root, l.knee), l.a, 1e-9) && near(l.a, aBrief, 0.002), l.a.toFixed(4));
    check(`${tag} lower length`, near(dist(l.knee, l.foot), l.b, 1e-9) && near(l.b, bBrief, 0.002), l.b.toFixed(4));
    check(`${tag} knee above root-foot line`, l.knee[1] >= Math.min(l.root[1], l.foot[1]) - 1e-9);
    check(`${tag} bend is ${60 * bendFactor(l.pair)}°`, near(l.bend, 60 * bendFactor(l.pair), 0.1), l.bend.toFixed(3));
    check(`${tag} status ok`, l.status === 'ok', l.status);
  }
  check('preset bends halve toward the front', near(leg(m, 0, 1).bend, 30, 0.1) && near(leg(m, 3, 1).bend, 60, 0.1));
  // Preset feet were placed so the lower segment matches the brief at 1.47 m walls.
  for (const q of m.stats.pairs) {
    check(`pair ${q.pair} total leg is 3.25 L`, near(q.totalInL, 3.25, 0.01), q.totalInL.toFixed(4));
    check(`pair ${q.pair} knee at 48 %`, near(q.kneeFraction, 0.48, 0.003), q.kneeFraction.toFixed(4));
    check(`pair ${q.pair} foot height kept`, near(q.footHeight, legOf(p, q.pair - 1, 1).footHeight));
  }
  check('front view circle is the abdomen', m.abdomen.height > m.head.height);
  check('head continues into the abdomen', m.head.length > p.headLength && m.head.length < p.headLength + 0.1);
  check('body is level without pitch', near(m.abdomen.center[1], p.bodyHeight) && near(m.head.center[1], p.bodyHeight) && m.abdomen.rotZ === 0);

  // Facing flips the body along x but keeps the feet mirrored.
  const back = buildSpider({ ...p, facing: 1 }, walls);
  check('facing flips head side', Math.sign(m.head.center[0] - m.abdomen.center[0]) === -Math.sign(back.head.center[0] - back.abdomen.center[0]));
  check('facing keeps leg lengths', back.legs.every((l, i) => near(l.b, m.legs[i].b, 1e-9)));

  // Pitch rotates the whole spider about the body centre: the head end
  // rises, the legs turn with it keeping their lengths and bends, the feet
  // stay on their walls, whichever way the body faces.
  for (const facing of [-1, 1]) {
    const flat = buildSpider({ ...p, facing }, walls);
    const up = buildSpider({ ...p, facing, pitch: 35 }, walls);
    const tag = facing < 0 ? 'toward the street' : 'into the alley';
    check(`pitch ${tag}: head above abdomen`, up.head.center[1] > up.abdomen.center[1] + 0.1);
    check(`pitch ${tag}: body length kept`, near(up.L, L));
    check(`pitch ${tag}: roots rise`, up.legs.every((l, i) => l.root[1] > flat.legs[i].root[1]));
    check(`pitch ${tag}: leg lengths kept`, up.legs.every((l, i) => near(l.a, flat.legs[i].a, 1e-9) && near(l.b, flat.legs[i].b, 1e-9)));
    check(`pitch ${tag}: bends kept`, up.legs.every((l, i) => near(l.bend, flat.legs[i].bend, 1e-6)));
    check(`pitch ${tag}: feet on their walls`, up.legs.every(l => near(Math.abs(l.foot[2]), 1.47)));
    check(`pitch ${tag}: front feet rise, back feet drop`, leg(up, 0, 1).foot[1] > leg(flat, 0, 1).foot[1] + 0.5 && leg(up, 3, 1).foot[1] < leg(flat, 3, 1).foot[1] - 0.5);
    check(`pitch ${tag}: centre of the feet turns about the body`, near(dist(leg(up, 0, 1).foot, [up.params.along, up.params.bodyHeight, 1.47]), dist(leg(flat, 0, 1).foot, [flat.params.along, flat.params.bodyHeight, 1.47]), 1e-9));
    check(`pitch ${tag}: mesh tilt sign`, Math.sign(up.head.rotZ) === Math.sign(facing));
    check(`pitch ${tag}: top is higher`, up.stats.topHeight >= flat.stats.topHeight);
  }
  // Points placed in the world come back at the same world point when pitched.
  const pitched = { ...p, pitch: 35 };
  const kp = [7.0, 3.4, 0.9];
  const mp = buildSpider(withLeg(pitched, 2, 1, kneeParamsAt(pitched, 1, kp)), walls);
  check('pitched knee lands where it is put', dist(leg(mp, 2, 1).knee, kp) < 2e-3, JSON.stringify(leg(mp, 2, 1).knee));
  const fp = [5.2, 3.0, 0];
  const mf = buildSpider(withLeg(pitched, 1, 1, footParamsAt(pitched, fp)), walls);
  check('pitched foot lands where it is put', near(leg(mf, 1, 1).foot[0], 5.2, 2e-3) && near(leg(mf, 1, 1).foot[1], 3.0, 2e-3) && near(leg(mf, 1, 1).foot[2], 1.47));
  const mb = buildSpider(withLeg(pitched, 3, 1, kneeFromBend(pitched, walls, 3, aBrief, 90)), walls);
  check('kneeFromBend holds under pitch', near(leg(mb, 3, 1).bend, 90, 0.1) && near(leg(mb, 3, 1).a, aBrief, 1e-3), leg(mb, 3, 1).bend.toFixed(2));

  // A knee or a foot put at a point comes back at that point, and only that
  // leg moves; the segment lengths and bend follow.
  const kneePt = [7.1, 3.2, 0.9];
  const m2 = buildSpider(withLeg(p, 1, 1, kneeParamsAt(p, 1, kneePt)), walls);
  check('knee lands where it is put', dist(leg(m2, 1, 1).knee, kneePt) < 1e-3, JSON.stringify(leg(m2, 1, 1).knee));
  check('the other leg of the pair stays', dist(leg(m2, 1, -1).knee, leg(m, 1, -1).knee) < 1e-9);
  check('lengths follow the knee', near(leg(m2, 1, 1).a, dist(leg(m2, 1, 1).root, kneePt), 1e-3));
  const footPt = [5.0, 2.2, 0];
  const m3 = buildSpider(withLeg(p, 2, -1, footParamsAt(p, footPt)), walls);
  check('left foot lands where it is put, on its wall', near(leg(m3, 2, -1).foot[0], 5.0, 1e-3) && near(leg(m3, 2, -1).foot[1], 2.2, 1e-3) && near(leg(m3, 2, -1).foot[2], -1.47));
  check('right foot stays', dist(leg(m3, 2, 1).foot, leg(m, 2, 1).foot) < 1e-9);

  // Choosing a bend re-places the knee for the current upper length, per leg.
  const m4 = buildSpider(withLeg(p, 3, -1, kneeFromBend(p, walls, 3, aBrief, 90, -1)), walls);
  check('kneeFromBend gives the bend on the left leg', near(leg(m4, 3, -1).bend, 90, 0.1) && near(leg(m4, 3, -1).a, aBrief, 1e-3), leg(m4, 3, -1).bend.toFixed(3));
  check('the right leg keeps its bend', near(leg(m4, 3, 1).bend, 60, 0.1));

  // Designs saved per pair, with a bend and an upper length, still build to the same knees.
  const { legs: _legs, ...bare } = p;
  const legacy = [0, 1, 2, 3].map(i => ({ bend: 60 * bendFactor(i), upper: aBrief, footAlong: legOf(p, i, 1).footAlong, footHeight: legOf(p, i, 1).footHeight }));
  const m5 = buildSpider({ ...bare, pairs: legacy }, walls);
  check('legacy pairs give the same knees', m5.legs.every((l, i) => dist(l.knee, m.legs[i].knee) < 2e-3), m5.legs.map((l, i) => dist(l.knee, m.legs[i].knee).toFixed(4)).join(','));
  const upgraded = upgradeParams({ ...bare, headLength: 0.24, overlap: 0.048, pairs: [0, 1, 2, 3].map(i => legOf(p, i, 1)) });
  check('upgrade folds the overlap into the head length', near(upgraded.headLength, 0.192) && !('overlap' in upgraded) && upgraded.pitch === 0);
  check('upgrade expands pairs into eight legs', !('pairs' in upgraded) && upgraded.legs.length === 8 && JSON.stringify(upgraded.legs[7]) === JSON.stringify(legOf(p, 3, 1)));
  const settled = upgradeParams({ ...bare, facing: 1, across: 0.4, headLift: 0.2, bodyShape: 'ellipsoid' });
  check('upgrade settles facing, across, lift and shape', settled.facing === -1 && settled.across === 0 && settled.headLift === 0 && settled.bodyShape === 'capsule');
  check('preset body is a capsule facing the street', p.bodyShape === 'capsule' && p.facing === -1);

  // Solver puts the lower segment at the target on wider walls, keeping the bend.
  const wide = flatWalls(3.6);
  const solved = { ...p, legs: solveFeetForLength(p, wide, b, [0, 1, 2, 3].map(i => ({ upper: aBrief, bend: 60 * bendFactor(i) }))) };
  const ms = buildSpider(solved, wide);
  for (const q of ms.stats.pairs) check(`solved pair ${q.pair} lower = ${b} both sides`, near(q.lower, b, 0.002) && near(q.lowerOtherSide, b, 0.002) && near(q.bend, 60 * bendFactor(q.pair - 1), 0.1), `${q.lower.toFixed(4)} ${q.lowerOtherSide.toFixed(4)} ${q.bend.toFixed(2)}`);

  // The sun at noon on Halloween over the alley: south-south-east, 28.5°
  // up (NOAA calculator values for 46.2499 N, 1.4967 W, 2026-10-31 11:00 UTC).
  const sun = solarPosition(HALLOWEEN_NOON, 46.249891, -1.496728);
  check('Halloween noon sun azimuth', near(sun.azimuth, 166.3, 0.3), sun.azimuth.toFixed(2));
  check('Halloween noon sun elevation', near(sun.elevation, 28.5, 0.3), sun.elevation.toFixed(2));
  check('Halloween noon is CET', HALLOWEEN_NOON.getUTCHours() === 11);
  const noon = solarPosition(new Date('2026-10-31T11:50:00Z'), 46.249891, -1.496728);
  check('solar noon is due south', near(noon.azimuth, 180, 0.5) && noon.elevation > sun.elevation, noon.azimuth.toFixed(2));
  const night = solarPosition(new Date('2026-10-31T19:00:00Z'), 46.249891, -1.496728);
  check('sun is down at 20:00', night.elevation < 0, night.elevation.toFixed(1));
  const june = solarPosition(new Date('2026-06-21T12:00:00Z'), 46.249891, -1.496728);
  check('midsummer sun is high', june.elevation > 65, june.elevation.toFixed(1));
  const v = sunVector(HALLOWEEN_NOON, 46.249891, -1.496728);
  check('sun vector points south and up', v[2] < -0.8 && v[1] > 0.4 && v[0] > 0 && near(Math.hypot(...v), 1, 1e-9), JSON.stringify(v));

  // Posing from the two angles at given plan angles (one per leg here): the
  // hip elevation and bends as chosen, the brief's split, feet on the walls,
  // and the plan angles kept.
  const hipDeg = 15;
  const plan8 = [10, -5, 30, 25, -20, -35, -50, -60];
  const posed = buildSpider({ ...p, legs: legsFromAngles(p, walls, { hip: hipDeg, backBend: 60, azimuths: plan8, maxLength: Infinity }).legs }, walls);
  const planOfLeg = l => Math.atan2(-(l.foot[0] - l.root[0]), Math.abs(l.foot[2] - l.root[2])) / (Math.PI / 180); // facing -1: toward the head is -x
  const hipOfLeg = l => Math.atan2(l.knee[1] - l.root[1], Math.hypot(l.knee[0] - l.root[0], l.knee[2] - l.root[2])) / (Math.PI / 180);
  for (const l of posed.legs) {
    const j = legIndex(l.pair, l.side), tag = `angles leg ${l.pair}${l.side > 0 ? 'R' : 'L'}`;
    check(`${tag} plan angle ${plan8[j]}°`, near(planOfLeg(l), plan8[j], 0.5), planOfLeg(l).toFixed(2));
    check(`${tag} hip is ${hipDeg}°`, near(hipOfLeg(l), hipDeg, 0.3), hipOfLeg(l).toFixed(2));
    check(`${tag} bend as chosen`, near(l.bend, 60 * bendFactor(l.pair), 0.3), l.bend.toFixed(2));
    check(`${tag} split kept`, near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.005), (l.a / (l.a + l.b)).toFixed(3));
    check(`${tag} foot on its wall`, near(Math.abs(l.foot[2]), 1.47) && l.status === 'ok');
  }
  const readBack = planAngles(posed.params, walls);
  check('angles: the plan angles read back from the pose', readBack.every((v, j) => near(v, plan8[j], 0.5)), readBack.map(v => v.toFixed(1)).join(','));
  // Posing again at other angles, from the plan angles the pose has, keeps
  // the fan: the feet stay where they are along the walls, the hip, bends,
  // heights and lengths change.
  const reposed = buildSpider({ ...posed.params, legs: legsFromAngles(posed.params, walls, { hip: 40, backBend: 90, azimuths: readBack, maxLength: Infinity }).legs }, walls);
  check('angles: posing again keeps every plan angle', reposed.legs.every(l => near(planOfLeg(l), plan8[legIndex(l.pair, l.side)], 0.5)), reposed.legs.map(planOfLeg).map(v => v.toFixed(1)).join(','));
  check('angles: posing again keeps the feet in place along the walls', reposed.legs.every((l, i) => near(l.foot[0], posed.legs[i].foot[0], 2e-3)), reposed.legs.map((l, i) => (l.foot[0] - posed.legs[i].foot[0]).toFixed(3)).join(','));
  check('angles: posing again sets the new hip and bends', reposed.legs.every(l => near(hipOfLeg(l), 40, 0.3) && near(l.bend, 90 * bendFactor(l.pair), 0.3)), reposed.legs.map(l => hipOfLeg(l).toFixed(1) + '/' + l.bend.toFixed(1)).join(','));
  check('angles: posing again keeps the feet on the walls', reposed.legs.every(l => near(Math.abs(l.foot[2]), 1.47) && l.status === 'ok'));
  check('angles: steeper legs are longer', reposed.legs.every((l, i) => l.a + l.b > posed.legs[i].a + posed.legs[i].b + 0.05), reposed.legs.map((l, i) => (l.a + l.b - posed.legs[i].a - posed.legs[i].b).toFixed(3)).join(','));
  // The spread: plan angles as the table, the two angles kept, legs scaled to the wall.
  const spread = buildSpider({ ...p, legs: legsFromAngles(p, walls, { hip: hipDeg, backBend: 60, azimuths: SPREAD_AZIMUTHS, maxLength: Infinity }).legs }, walls);
  for (const l of spread.legs) {
    const tag = `spread leg ${l.pair}${l.side > 0 ? 'R' : 'L'}`;
    const az = Math.atan2(-(l.foot[0] - l.root[0]), Math.abs(l.foot[2] - l.root[2])) / (Math.PI / 180); // facing -1: toward the head is -x
    check(`${tag} plan angle ${SPREAD_AZIMUTHS[l.pair]}°`, near(az, SPREAD_AZIMUTHS[l.pair], 0.5), az.toFixed(2));
    const horiz = Math.hypot(l.knee[0] - l.root[0], l.knee[2] - l.root[2]);
    check(`${tag} hip kept`, near(Math.atan2(l.knee[1] - l.root[1], horiz) / (Math.PI / 180), hipDeg, 0.5));
    check(`${tag} bend kept`, near(l.bend, 60 * bendFactor(l.pair), 0.5), l.bend.toFixed(2));
    check(`${tag} split kept`, near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.005), (l.a / (l.a + l.b)).toFixed(3));
    check(`${tag} foot on its wall`, near(Math.abs(l.foot[2]), 1.47) && l.status === 'ok');
  }
  check('spread: front legs longer than the middle ones', leg(spread, 0, 1).a + leg(spread, 0, 1).b > leg(spread, 1, 1).a + leg(spread, 1, 1).b + 0.3);
  const spreadPlan = planAngles(spread.params, walls);
  check('spread: plan angles read back from the pose', spreadPlan.every((v, j) => near(v, SPREAD_AZIMUTHS[Math.floor(j / 2)], 0.5)), spreadPlan.map(v => v.toFixed(1)).join(','));

  // Per-leg angles read back, and per-leg hips and bends posed.
  const angles = legAngles(posed.params, walls);
  check('legAngles reads plan, hip and bend', angles.every((x, j) => near(x.plan, plan8[j], 0.5) && near(x.hip, hipDeg, 0.3) && near(x.bend, 60 * bendFactor(Math.floor(j / 2)), 0.3)), JSON.stringify(angles.map(x => [x.plan, x.hip, x.bend].map(v => +v.toFixed(1)))));
  const hips8 = [5, 10, 15, 20, 25, 30, 35, 40], bends8 = [20, 30, 40, 50, 60, 70, 80, 90];
  const perLeg = buildSpider({ ...p, legs: legsFromAngles(p, walls, { azimuths: plan8, hips: hips8, bends: bends8, maxLength: Infinity }).legs }, walls);
  check('per-leg hips and bends posed', perLeg.legs.every((l, j) => near(hipOfLeg(l), hips8[j], 0.3) && near(l.bend, bends8[j], 0.3) && near(planOfLeg(l), plan8[j], 0.5) && near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.005)), perLeg.legs.map(l => hipOfLeg(l).toFixed(1) + '/' + l.bend.toFixed(1)).join(','));

  // The split rule after a drag. From a moved knee: the knee stays, the
  // foot moves along the wall so the lower segment is the brief's share,
  // in the knee's vertical plane.
  const splitOf = l => l.a / (l.a + l.b);
  const planar = l => { // the knee in the vertical plane through root and foot
    const u = [l.foot[0] - l.root[0], l.foot[2] - l.root[2]], k = [l.knee[0] - l.root[0], l.knee[2] - l.root[2]];
    return Math.abs(u[0] * k[1] - u[1] * k[0]) / Math.hypot(...u) < 2e-3;
  };
  const lifted = l => { // the knee above the root-foot line
    const u = [l.foot[0] - l.root[0], l.foot[1] - l.root[1], l.foot[2] - l.root[2]], k = [l.knee[0] - l.root[0], l.knee[1] - l.root[1], l.knee[2] - l.root[2]];
    const s = (u[0] * k[0] + u[1] * k[1] + u[2] * k[2]) / (u[0] * u[0] + u[1] * u[1] + u[2] * u[2]);
    return k[1] > s * u[1] - 1e-6;
  };
  const jK = legIndex(3, 1);
  const movedK = { ...posed.params, legs: posed.params.legs.map(q => ({ ...q })) };
  movedK.legs[jK] = { ...movedK.legs[jK], kneeAlong: movedK.legs[jK].kneeAlong + 0.15, kneeHeight: movedK.legs[jK].kneeHeight + 0.2 };
  const fromKnee = solveLegFromKnee(movedK, walls, 3, 1);
  check('knee rule: solved', !!fromKnee);
  if (fromKnee) {
    movedK.legs[jK] = fromKnee;
    const l = buildSpider(movedK, walls).legs[jK], was = posed.legs[jK];
    check('knee rule: the knee is where it was put', near(l.knee[0], was.knee[0] - 0.15, 2e-3) && near(l.knee[1], was.knee[1] + 0.2, 2e-3) && near(l.knee[2], was.knee[2], 2e-3), JSON.stringify([was.knee, l.knee]));
    check('knee rule: split is the brief\'s', near(splitOf(l), LOCKED.kneeFraction, 0.003), splitOf(l).toFixed(3));
    check('knee rule: foot on its wall, in the knee\'s plane', near(Math.abs(l.foot[2]), 1.47) && l.status === 'ok' && planar(l));
    check('knee rule: the foot moved', Math.hypot(l.foot[0] - was.foot[0], l.foot[1] - was.foot[1]) > 0.02, Math.hypot(l.foot[0] - was.foot[0], l.foot[1] - was.foot[1]).toFixed(3));
    check('knee rule: the lower segment still points down', l.foot[1] < l.knee[1]);
  }
  const tooClose = { ...movedK, legs: movedK.legs.map(q => ({ ...q })) };
  tooClose.legs[jK] = { ...tooClose.legs[jK], kneeOut: p.headWidth / 2 + 0.1, kneeAlong: rootAlongOffset(p, 3), kneeHeight: p.bodyHeight + 0.02 };
  check('knee rule: a knee too near the body for the lower segment to reach the wall is refused', solveLegFromKnee(tooClose, walls, 3, 1) === null);
  // From a moved foot: the leg keeps its bend and split, turning and scaling to reach.
  const jF = legIndex(1, -1);
  const movedF = { ...posed.params, legs: posed.params.legs.map(q => ({ ...q })) };
  movedF.legs[jF] = { ...movedF.legs[jF], footAlong: movedF.legs[jF].footAlong + 0.4, footHeight: movedF.legs[jF].footHeight + 0.3 };
  const fromFoot = solveLegFromFoot(movedF, walls, 1, -1, { bend: posed.legs[jF].bend });
  check('foot rule: solved', !!fromFoot);
  if (fromFoot) {
    movedF.legs[jF] = fromFoot;
    const l = buildSpider(movedF, walls).legs[jF], was = posed.legs[jF];
    check('foot rule: the foot is where it was put', near(l.foot[0], was.foot[0] - 0.4, 2e-3) && near(l.foot[1], was.foot[1] + 0.3, 2e-3) && near(Math.abs(l.foot[2]), 1.47), JSON.stringify([was.foot, l.foot]));
    check('foot rule: bend kept', near(l.bend, was.bend, 0.3), `${was.bend.toFixed(2)} -> ${l.bend.toFixed(2)}`);
    check('foot rule: split is the brief\'s', near(splitOf(l), LOCKED.kneeFraction, 0.003), splitOf(l).toFixed(3));
    check('foot rule: knee in the plane, lifted', planar(l) && lifted(l));
    check('foot rule: the leg scaled to reach', near(l.a + l.b, (was.a + was.b) * l.d / was.d, 5e-3), `${(l.a + l.b).toFixed(3)} vs ${((was.a + was.b) * l.d / was.d).toFixed(3)}`);
  }
  // The feet solver takes its targets per leg and defaults to each leg's own values.
  const solvedAll = buildSpider({ ...perLeg.params, legs: solveFeetForLength(perLeg.params, walls, bBrief) }, walls);
  check('feet solver keeps each leg\'s own upper and bend', solvedAll.legs.every((l, j) => near(l.a, perLeg.legs[j].a, 3e-3) && near(l.bend, bends8[j], 0.5) && near(l.b, bBrief, 3e-3)), solvedAll.legs.map(l => `${l.a.toFixed(2)}/${l.bend.toFixed(0)}/${l.b.toFixed(2)}`).join(','));

  // The brief's length caps a pose: a leg that would need more is held at
  // it and its foot slides toward straight across; one that cannot reach
  // its wall even straight across is stretched to just reach.
  const reach = 1.47 - p.headWidth / 2;
  const unitOf = (hipD, bendD) => LOCKED.kneeFraction * Math.cos(hipD * Math.PI / 180) + (1 - LOCKED.kneeFraction) * Math.cos((hipD - bendD) * Math.PI / 180);
  const capPose = legsFromAngles(p, walls, { hip: 15, backBend: 105, azimuths: SPREAD_AZIMUTHS });
  const capSpider = buildSpider({ ...p, legs: capPose.legs }, walls);
  const capBack = leg(capSpider, 3, 1), capFront = leg(capSpider, 0, 1), capMid = leg(capSpider, 1, 1);
  check('cap: a leg that cannot reach even straight across is stretched', capPose.stretched.includes(legIndex(3, 1)) && near(planOfLeg(capBack), 0, 0.5) && near(capBack.a + capBack.b, reach / unitOf(15, 105), 0.02), `${planOfLeg(capBack).toFixed(1)} ${(capBack.a + capBack.b).toFixed(3)} vs ${(reach / unitOf(15, 105)).toFixed(3)}`);
  check('cap: a leg that would be too long is held at the brief\'s length, foot moved in', capPose.capped.includes(legIndex(0, 1)) && near(capFront.a + capFront.b, aBrief + bBrief, 3e-3) && near(planOfLeg(capFront), Math.acos(reach / ((aBrief + bBrief) * unitOf(15, 52.5))) * 180 / Math.PI, 0.5), `${(capFront.a + capFront.b).toFixed(3)} ${planOfLeg(capFront).toFixed(2)}`);
  check('cap: a leg that fits keeps its plan angle', !capPose.capped.includes(legIndex(1, 1)) && !capPose.stretched.includes(legIndex(1, 1)) && near(planOfLeg(capMid), 22, 0.5) && capMid.a + capMid.b < aBrief + bBrief, `${planOfLeg(capMid).toFixed(2)} ${(capMid.a + capMid.b).toFixed(3)}`);
  check('cap: no leg longer than the brief\'s unless stretched', capSpider.legs.every((l, j) => l.a + l.b <= aBrief + bBrief + 3e-3 || capPose.stretched.includes(j)));
  check('cap: hips, bends and split kept on held and stretched legs', capSpider.legs.every(l => near(hipOfLeg(l), 15, 0.3) && near(l.bend, 105 * bendFactor(l.pair), 0.3) && near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.003)), capSpider.legs.map(l => hipOfLeg(l).toFixed(1) + '/' + l.bend.toFixed(1)).join(','));
  const freePose = buildSpider({ ...p, legs: legsFromAngles(p, walls, { hip: 15, backBend: 105, azimuths: SPREAD_AZIMUTHS, maxLength: Infinity }).legs }, walls);
  check('cap: without it the fan is exact at any length', near(planOfLeg(leg(freePose, 3, 1)), -55, 0.5) && leg(freePose, 3, 1).a + leg(freePose, 3, 1).b > 4.5, (leg(freePose, 3, 1).a + leg(freePose, 3, 1).b).toFixed(2));
  // Drags under the cap: a foot pulled past the brief's length unfolds the
  // leg; past a straight leg's reach it is refused; a knee further from the
  // body than 48 % of the brief's length is refused.
  const forwardOf = l => -(l.foot[0] - l.root[0]); // facing -1: toward the head is -x
  const farF = (ahead) => { const d = { ...posed.params, legs: posed.params.legs.map(q => ({ ...q })) }; d.legs[jF] = { ...d.legs[jF], footAlong: d.legs[jF].footAlong + (ahead - forwardOf(posed.legs[jF])) }; return d; };
  const unfoldD = farF(2.12), unfolded = solveLegFromFoot(unfoldD, walls, 1, -1, { bend: posed.legs[jF].bend });
  check('foot rule: past the brief\'s length the leg unfolds instead of growing', !!unfolded && (() => { unfoldD.legs[jF] = unfolded; const l = buildSpider(unfoldD, walls).legs[jF]; return near(l.a + l.b, aBrief + bBrief, 3e-3) && l.bend < posed.legs[jF].bend - 3 && near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.003); })(), unfolded && JSON.stringify(buildSpider({ ...unfoldD, legs: unfoldD.legs.map((q, i) => i === jF ? unfolded : q) }, walls).legs[jF].bend));
  check('foot rule: beyond a straight leg\'s reach is refused', solveLegFromFoot(farF(2.4), walls, 1, -1, { bend: posed.legs[jF].bend }) === null);
  const farK = { ...posed.params, legs: posed.params.legs.map(q => ({ ...q })) };
  farK.legs[jK] = { ...farK.legs[jK], kneeAlong: rootAlongOffset(p, 3) + 0.3, kneeOut: p.headWidth / 2 + 1.3, kneeHeight: p.bodyHeight + 0.4 };
  const pulled = solveLegFromKnee(farK, walls, 3, 1);
  check('knee rule: a knee further out than the brief\'s upper segment is pulled back to it', !!pulled && (() => { farK.legs[jK] = pulled; const l = buildSpider(farK, walls).legs[jK]; return near(l.a, aBrief, 2e-3) && near(l.a / (l.a + l.b), LOCKED.kneeFraction, 0.003) && near(Math.abs(l.foot[2]), 1.47) && l.status === 'ok'; })(), JSON.stringify(pulled));

  // Site: alley frame round trip and real walls about 3 m apart near the body.
  const site = await loadSite();
  const [e, n] = site.frame.toSite(10, 0.5);
  const [x, z] = site.frame.toAlley(e, n);
  check('alley frame round trip', near(x, 10, 1e-9) && near(z, 0.5, 1e-9));
  check('alley runs about south', Math.abs(site.frame.along[1] + 1) < 0.01, JSON.stringify(site.frame.along));
  const sw = wallsFromSite(site);
  const gaps = [3, 5, 8, 12].map(xx => { const r = sw(xx, 1, 0), l = sw(xx, -1, 0); return r !== null && l !== null ? r - l : null; });
  check('walls found along the alley', gaps.every(g => g !== null), JSON.stringify(gaps));
  check('gap about 3 m along the used stretch', gaps.slice(1).every(g => g > 2.6 && g < 3.3), JSON.stringify(gaps));
  check('gap wider at the mouth', gaps[0] > gaps[1], JSON.stringify(gaps));
  const real = buildSpider(DEFAULTS, sw);
  check('real-site legs all placed', real.legs.every(l => l.status === 'ok'), real.legs.map(l => l.status).join(','));
  for (const l of real.legs) check(`real leg ${l.pair} foot on a building edge`, near(dist(l.knee, l.foot), l.b, 1e-9));
  out.push('gaps along the alley at x = 3, 5, 8, 12 m: ' + gaps.map(g => g.toFixed(2)).join(', '));
  // Walking collisions: inside the east house is blocked, the alley centre is free.
  check('inside a building is blocked', insideBuilding(site, 6.5, -8, 0.35));
  const [ce, cn] = site.frame.toSite(8, 0);
  check('alley centre is free', !insideBuilding(site, ce, cn, 0.35));
  const [we, wn] = site.frame.toSite(8, sw(8, 1, 0) - 0.1);
  check('10 cm from a wall is blocked', insideBuilding(site, we, wn, 0.35));
} catch (err) {
  failed++;
  out.push('ERROR ' + (err.stack || err));
}
out.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = out.join('\n');
document.title = failed ? 'FAILED' : 'PASSED';
</script></body></html>
