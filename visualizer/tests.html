    check('eyes: the parts list carries the kit chosen, none by default', frameParts.eyes === 'none' && frameParts.bom.cost.lines.filter(l => l.eyes).length === 0 && withEyes('googly').bom.cost.lines.filter(l => l.eyes === 'googly').length === 2 && withEyes('lit').eyes === 'lit' && withEyes('lit').bom.cost.lines.filter(l => l.eyes === 'lit').length === 3 && withEyes('none').bom.cost.lines.every(l => !l.eyes) && withEyes('none').eyes === 'none' && withEyes('owl').eyes === 'none' && withEyes('lit').bom.cost.total > withEyes('none').bom.cost.total && withEyes('googly').bom.cost.total > withEyes('none').bom.cost.total && withEyes('googly').bom.cost.lines.every(l => l.group !== 'covering and body' || !l.eyes || /eyes/.test(l.item)));
  }

  // Site: alley frame round trip and real walls about 3 m apart near the body.
  const site = await loadSite();
  const [e, n] = site.frame.toSite(10, 0.5);
  const [x, z] = site.frame.toAlley(e, n);
  check('alley frame round trip', near(x, 10, 1e-9) && near(z, 0.5, 1e-9));
  check('alley runs about south', Math.abs(site.frame.along[1] + 1) < 0.01, JSON.stringify(site.frame.along));
  const sw = wallsFromSite(site);
  const gaps = [3, 5, 8, 12].map(xx => { const r = sw(xx, 1, 0), l = sw(xx, -1, 0); return r !== null && l !== null ? r - l : null; });
  check('walls found along the alley', gaps.every(g => g !== null), JSON.stringify(gaps));
  check('gap about 3 m along the used stretch', gaps.slice(1).every(g => g > 2.6 && g < 3.3), JSON.stringify(gaps));
  check('gap wider at the mouth', gaps[0] > gaps[1], JSON.stringify(gaps));
  const real = buildSpider(DEFAULTS, sw);
  check('real-site legs all placed', real.legs.every(l => l.status === 'ok'), real.legs.map(l => l.status).join(','));
  for (const l of real.legs) check(`real leg ${l.pair} foot on a building edge`, near(dist(l.knee, l.foot), l.b, 1e-9));
  // The construction on the real walls: every post stands, each ski has its four posts.
  const realParts = buildParts(real, DEFAULTS, sw, { system: systemById('pvc40'), maxPiece: 2.0 });
  check('real-site parts: 8 posts of positive length', realParts.cuts.filter(c => c.role === 'post').every(c => c.length > 0.5));
  check('real-site parts: two skis with four posts each', realParts.skis.length === 2 && realParts.skis.every(s => s.posts.length === 4 && s.length > 1.5));
  check('real-site parts: deterministic', JSON.stringify(realParts) === JSON.stringify(buildParts(real, DEFAULTS, sw, { system: systemById('pvc40'), maxPiece: 2.0 })));
  // On the stepped real walls every post still meets its tee: the ski runs
  // at the innermost foot and the other posts lean across to it.
  check('real-site parts: every post meets its tee', realParts.members.filter(x => x.role === 'post').every(x => { const tee = realParts.fittings.find(f => f.role === 'tee' && f.leg === x.leg); return tee && dist(tee.at, x.b) < 1e-9; }));
  check('real-site parts: the skis lean the posts and say so', realParts.skis.every(s => s.lean > 0.01 && s.lean < 0.1) && realParts.warnings.filter(w => /posts lean up to 0\.0\d m across/.test(w)).length === 2, JSON.stringify(realParts.warnings));
  check('real-site parts: the skis sit inside the innermost foot', realParts.skis.every(s => real.legs.filter(l => (l.side > 0) === (s.side === 'R')).every(l => Math.abs(s.z) <= Math.abs(l.foot[2]) - 0.02)));
  out.push('real-site build warnings: ' + realParts.warnings.join(' | '));
  // Plumb posts on the real walls: each side's feet on one line, the
  // innermost real wall over their stretch; every post vertical; no lean
  // warning; the gap to the stepping wall reported with a number.
  const straightSite = straightWalls(sw, DEFAULTS);
  const plumb = buildSpider(DEFAULTS, straightSite);
  const plumbParts = buildParts(plumb, DEFAULTS, straightSite, { system: systemById('pvc40'), maxPiece: 2.0, realWalls: sw });
  for (const side of [1, -1]) {
    const tag = side > 0 ? 'right' : 'left';
    const zs = plumb.legs.filter(l => l.side === side).map(l => l.foot[2]);
    const realZs = real.legs.filter(l => l.side === side).map(l => Math.abs(l.foot[2]));
    check(`real-site plumb: the ${tag} feet share one z, no further out than any real foot`, zs.every(z => near(z, zs[0], 1e-9)) && Math.abs(zs[0]) <= Math.min(...realZs) + 1e-9 && Math.abs(zs[0]) > 1.3, JSON.stringify([zs, realZs]));
  }
  check('real-site plumb: every post is vertical', plumbParts.members.filter(x => x.role === 'post').every(x => Math.abs(x.a[0] - x.b[0]) < 1e-3 && Math.abs(x.a[2] - x.b[2]) < 1e-3) && plumbParts.skis.every(s => s.lean === 0) && plumbParts.legsAssembly.every(a => a.postLean.across === 0), JSON.stringify(plumbParts.skis));
  check('real-site plumb: no lean warning, the gap to the real wall reported where it steps', !plumbParts.warnings.some(w => /lean/.test(w)) && plumbParts.skis.every(s => s.gap >= 0 && s.gap < 1.0 && (s.gapAt === null || (s.gapAt >= s.from - 1e-9 && s.gapAt <= s.to + 1e-9))) && plumbParts.skis.filter(s => s.gap > 0.005).length === plumbParts.warnings.filter(w => /off the wall/.test(w)).length, JSON.stringify(plumbParts.warnings));
  check('real-site plumb: the ski is not inside the real wall', !plumbParts.warnings.some(w => /into the wall/.test(w)));
  check('real-site plumb: the legs still reach', plumb.legs.every(l => l.status === 'ok') && plumb.legs.every((l, i) => Math.abs(l.a + l.b - real.legs[i].a - real.legs[i].b) < 0.1));
  check('real-site plumb: off, everything is as before', JSON.stringify(buildParts(real, DEFAULTS, sw, { system: systemById('pvc40'), maxPiece: 2.0, realWalls: null })) === JSON.stringify(realParts));
  check('real-site plumb: the default build is posts and skis only', plumbParts.bracing === 'none' && plumbParts.bom.stays.count === 0 && plumbParts.bom.sandbags === 0 && !plumbParts.members.some(x => x.role === 'stay' || x.role === 'ballast'));
  out.push('real-site plumb warnings: ' + plumbParts.warnings.join(' | '));
  for (const br of ['none', 'frame', 'rigid']) {
    const bp = buildParts(plumb, DEFAULTS, straightSite, { system: systemById('pvc40'), maxPiece: 2.0, bracing: br, realWalls: sw });
    out.push(`real-site plumb ${br}: ${bp.bom.cost.total.toFixed(0)} €, ${bp.bom.weight.total.toFixed(1)} kg, ${bp.bom.sandbags} sandbags, ${bp.bom.stays.count} cords`);
  }
  out.push('gaps along the alley at x = 3, 5, 8, 12 m: ' + gaps.map(g => g.toFixed(2)).join(', '));
  // Walking collisions: inside the east house is blocked, the alley centre is free.
  check('inside a building is blocked', insideBuilding(site, 6.5, -8, 0.35));
  const [ce, cn] = site.frame.toSite(8, 0);
  check('alley centre is free', !insideBuilding(site, ce, cn, 0.35));
  const [we, wn] = site.frame.toSite(8, sw(8, 1, 0) - 0.1);
  check('10 cm from a wall is blocked', insideBuilding(site, we, wn, 0.35));
} catch (err) {
  failed++;
  out.push('ERROR ' + (err.stack || err));
}
out.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = out.join('\n');
document.title = failed ? 'FAILED' : 'PASSED';
</script></body></html>
