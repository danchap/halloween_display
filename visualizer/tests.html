<!doctype html>
<html><head><meta charset="utf-8"><title>spider.js tests</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body><pre id="out">running…</pre>
<script type="module">
import { LOCKED, DEFAULTS, briefPreset, buildSpider, bodyLength, flatWalls, rootToFootDistance,
         lowerSegmentFor, solveFeetForLength, bendFactor, placeKnee, kneeParamsAt, footParamsAt,
         kneeFromBend, upgradeParams } from './spider.js';
import { loadSite, wallsFromSite, insideBuilding } from './site.js';
import { HALLOWEEN_NOON, solarPosition, sunVector } from './sun.js';

const out = [];
let failed = 0;
function check(name, cond, detail = '') {
  out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  ' + detail));
  if (!cond) failed++;
}
const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
const leg = (m, pair, side) => m.legs.find(l => l.pair === pair && l.side === side);

try {
  // Locked ratios are consistent.
  check('segments sum to 1', near(LOCKED.headLength + LOCKED.abdomenLength, 1));
  check('head is 0.66 of abdomen width', near(LOCKED.headWidth / LOCKED.abdomenWidth, 0.66, 0.002));

  // Brief preset at L = 0.8 reproduces the ratios.
  const L = 0.8;
  const p = briefPreset(L);
  check('preset body length', near(bodyLength(p), L));
  check('preset abdomen', near(p.abdomenLength, 0.76 * L) && near(p.abdomenWidth, 0.494 * L) && near(p.abdomenHeight, 0.494 * L));
  check('preset head', near(p.headLength, 0.24 * L) && near(p.headWidth, 0.326 * L));
  check('bend factors', near(bendFactor(0), 0.5) && near(bendFactor(3), 1));
  check('preset pairs are points', p.pairs.every(q => ['footAlong', 'footHeight', 'kneeAlong', 'kneeHeight', 'kneeOut'].every(k => Number.isFinite(q[k]))));

  // Law of cosines round trip.
  const a = 1.248, b = 1.352;
  for (const bend of [0, 15, 60, 105, 140]) {
    const d = rootToFootDistance(a, b, bend);
    const b2 = lowerSegmentFor(a, d, bend);
    check(`lower segment recovered at ${bend}°`, b2 !== null && near(b2, b, 1e-9), String(b2));
  }
  check('infeasible foot gives null', lowerSegmentFor(1.0, 0.5, 30) === null);
  const fold = placeKnee([0, 0, 0], [0.5, 0, 0], 1.0, 30);
  check('too-close foot folds the leg flat', fold.folded && near(dist(fold.knee, [0, 0, 0]), 1.0, 1e-9));

  // Flat walls: feet on the walls, segment lengths as the brief, knees
  // lifted, bends as chosen (the preset rounds its points to the mm).
  const walls = flatWalls(2.94); // the preset places its feet for a 2.94 m alley
  const m = buildSpider(p, walls);
  const aBrief = LOCKED.legLength * L * LOCKED.kneeFraction, bBrief = LOCKED.legLength * L - aBrief;
  check('8 legs', m.legs.length === 8);
  for (const l of m.legs) {
    const tag = `leg ${l.pair}${l.side > 0 ? 'R' : 'L'}`;
    check(`${tag} foot on wall`, near(Math.abs(l.foot[2]), 1.47));
    check(`${tag} upper length`, near(dist(l.root, l.knee), l.a, 1e-9) && near(l.a, aBrief, 0.002), l.a.toFixed(4));
    check(`${tag} lower length`, near(dist(l.knee, l.foot), l.b, 1e-9) && near(l.b, bBrief, 0.002), l.b.toFixed(4));
    check(`${tag} knee above root-foot line`, l.knee[1] >= Math.min(l.root[1], l.foot[1]) - 1e-9);
    check(`${tag} bend is ${60 * bendFactor(l.pair)}°`, near(l.bend, 60 * bendFactor(l.pair), 0.1), l.bend.toFixed(3));
    check(`${tag} status ok`, l.status === 'ok', l.status);
  }
  check('preset bends halve toward the front', near(leg(m, 0, 1).bend, 30, 0.1) && near(leg(m, 3, 1).bend, 60, 0.1));
  // Preset feet were placed so the lower segment matches the brief at 1.47 m walls.
  for (const q of m.stats.pairs) {
    check(`pair ${q.pair} total leg is 3.25 L`, near(q.totalInL, 3.25, 0.01), q.totalInL.toFixed(4));
    check(`pair ${q.pair} knee at 48 %`, near(q.kneeFraction, 0.48, 0.003), q.kneeFraction.toFixed(4));
    check(`pair ${q.pair} foot height kept`, near(q.footHeight, p.pairs[q.pair - 1].footHeight));
  }
  check('front view circle is the abdomen', m.abdomen.height > m.head.height);
  check('head continues into the abdomen', m.head.length > p.headLength && m.head.length < p.headLength + 0.1);
  check('body is level without pitch', near(m.abdomen.center[1], p.bodyHeight) && near(m.head.center[1], p.bodyHeight) && m.abdomen.rotZ === 0);

  // Facing flips the body along x but keeps the feet mirrored.
  const back = buildSpider({ ...p, facing: 1 }, walls);
  check('facing flips head side', Math.sign(m.head.center[0] - m.abdomen.center[0]) === -Math.sign(back.head.center[0] - back.abdomen.center[0]));
  check('facing keeps leg lengths', back.legs.every((l, i) => near(l.b, m.legs[i].b, 1e-9)));

  // Pitch rotates the whole spider about the body centre: the head end
  // rises, the legs turn with it keeping their lengths and bends, the feet
  // stay on their walls, whichever way the body faces.
  for (const facing of [-1, 1]) {
    const flat = buildSpider({ ...p, facing }, walls);
    const up = buildSpider({ ...p, facing, pitch: 35 }, walls);
    const tag = facing < 0 ? 'toward the street' : 'into the alley';
    check(`pitch ${tag}: head above abdomen`, up.head.center[1] > up.abdomen.center[1] + 0.1);
    check(`pitch ${tag}: body length kept`, near(up.L, L));
    check(`pitch ${tag}: roots rise`, up.legs.every((l, i) => l.root[1] > flat.legs[i].root[1]));
    check(`pitch ${tag}: leg lengths kept`, up.legs.every((l, i) => near(l.a, flat.legs[i].a, 1e-9) && near(l.b, flat.legs[i].b, 1e-9)));
    check(`pitch ${tag}: bends kept`, up.legs.every((l, i) => near(l.bend, flat.legs[i].bend, 1e-6)));
    check(`pitch ${tag}: feet on their walls`, up.legs.every(l => near(Math.abs(l.foot[2]), 1.47)));
    check(`pitch ${tag}: front feet rise, back feet drop`, leg(up, 0, 1).foot[1] > leg(flat, 0, 1).foot[1] + 0.5 && leg(up, 3, 1).foot[1] < leg(flat, 3, 1).foot[1] - 0.5);
    check(`pitch ${tag}: centre of the feet turns about the body`, near(dist(leg(up, 0, 1).foot, [up.params.along, up.params.bodyHeight, 1.47]), dist(leg(flat, 0, 1).foot, [flat.params.along, flat.params.bodyHeight, 1.47]), 1e-9));
    check(`pitch ${tag}: mesh tilt sign`, Math.sign(up.head.rotZ) === Math.sign(facing));
    check(`pitch ${tag}: top is higher`, up.stats.topHeight >= flat.stats.topHeight);
  }
  // Points placed in the world come back at the same world point when pitched.
  const pitched = { ...p, pitch: 35 };
  const kp = [7.0, 3.4, 0.9];
  const mp = buildSpider({ ...pitched, pairs: pitched.pairs.map((q, i) => i === 2 ? { ...q, ...kneeParamsAt(pitched, 1, kp) } : q) }, walls);
  check('pitched knee lands where it is put', dist(leg(mp, 2, 1).knee, kp) < 2e-3, JSON.stringify(leg(mp, 2, 1).knee));
  const fp = [5.2, 3.0, 0];
  const mf = buildSpider({ ...pitched, pairs: pitched.pairs.map((q, i) => i === 1 ? { ...q, ...footParamsAt(pitched, fp) } : q) }, walls);
  check('pitched foot lands where it is put', near(leg(mf, 1, 1).foot[0], 5.2, 2e-3) && near(leg(mf, 1, 1).foot[1], 3.0, 2e-3) && near(leg(mf, 1, 1).foot[2], 1.47));
  const mb = buildSpider({ ...pitched, pairs: pitched.pairs.map((q, i) => i === 3 ? kneeFromBend(pitched, walls, 3, aBrief, 90) : q) }, walls);
  check('kneeFromBend holds under pitch', near(leg(mb, 3, 1).bend, 90, 0.1) && near(leg(mb, 3, 1).a, aBrief, 1e-3), leg(mb, 3, 1).bend.toFixed(2));

  // A knee or a foot put at a point comes back at that point (mirrored on
  // the other side); the segment lengths and bend follow.
  const kneePt = [7.1, 3.2, 0.9];
  const pairs2 = p.pairs.map((q, i) => i === 1 ? { ...q, ...kneeParamsAt(p, 1, kneePt) } : q);
  const m2 = buildSpider({ ...p, pairs: pairs2 }, walls);
  check('knee lands where it is put', dist(leg(m2, 1, 1).knee, kneePt) < 1e-3, JSON.stringify(leg(m2, 1, 1).knee));
  check('other knee mirrors it', near(leg(m2, 1, -1).knee[2], -kneePt[2], 1e-3) && near(leg(m2, 1, -1).knee[1], kneePt[1], 1e-3));
  check('lengths follow the knee', near(leg(m2, 1, 1).a, dist(leg(m2, 1, 1).root, kneePt), 1e-3));
  const footPt = [5.0, 2.2, 0];
  const pairs3 = p.pairs.map((q, i) => i === 2 ? { ...q, ...footParamsAt(p, footPt) } : q);
  const m3 = buildSpider({ ...p, pairs: pairs3 }, walls);
  check('foot lands where it is put, on the wall', near(leg(m3, 2, 1).foot[0], 5.0, 1e-3) && near(leg(m3, 2, 1).foot[1], 2.2, 1e-3) && near(leg(m3, 2, 1).foot[2], 1.47));

  // Choosing a bend re-places the knee for the current upper length.
  const bent = { ...p, pairs: p.pairs.map((q, i) => i === 3 ? kneeFromBend(p, walls, 3, aBrief, 90) : q) };
  const m4 = buildSpider(bent, walls);
  check('kneeFromBend gives the bend', near(leg(m4, 3, 1).bend, 90, 0.1) && near(leg(m4, 3, 1).a, aBrief, 1e-3), leg(m4, 3, 1).bend.toFixed(3));

  // Designs saved with a bend and an upper length still build, to the same knees.
  const legacy = p.pairs.map((q, i) => ({ bend: 60 * bendFactor(i), upper: aBrief, footAlong: q.footAlong, footHeight: q.footHeight }));
  const m5 = buildSpider({ ...p, pairs: legacy }, walls);
  check('legacy pairs give the same knees', m5.legs.every((l, i) => dist(l.knee, m.legs[i].knee) < 2e-3), m5.legs.map((l, i) => dist(l.knee, m.legs[i].knee).toFixed(4)).join(','));
  const upgraded = upgradeParams({ ...p, headLength: 0.24, overlap: 0.048 });
  check('upgrade folds the overlap into the head length', near(upgraded.headLength, 0.192) && !('overlap' in upgraded) && upgraded.pitch === 0);

  // Solver puts the lower segment at the target on wider walls, keeping the bend.
  const wide = flatWalls(3.6);
  const solved = { ...p, pairs: solveFeetForLength(p, wide, b, [0, 1, 2, 3].map(i => ({ upper: aBrief, bend: 60 * bendFactor(i) }))) };
  const ms = buildSpider(solved, wide);
  for (const q of ms.stats.pairs) check(`solved pair ${q.pair} lower = ${b}`, near(q.lower, b, 0.002) && near(q.bend, 60 * bendFactor(q.pair - 1), 0.1), `${q.lower.toFixed(4)} ${q.bend.toFixed(2)}`);

  // The sun at noon on Halloween over the alley: south-south-east, 28.5°
  // up (NOAA calculator values for 46.2499 N, 1.4967 W, 2026-10-31 11:00 UTC).
  const sun = solarPosition(HALLOWEEN_NOON, 46.249891, -1.496728);
  check('Halloween noon sun azimuth', near(sun.azimuth, 166.3, 0.3), sun.azimuth.toFixed(2));
  check('Halloween noon sun elevation', near(sun.elevation, 28.5, 0.3), sun.elevation.toFixed(2));
  check('Halloween noon is CET', HALLOWEEN_NOON.getUTCHours() === 11);
  const noon = solarPosition(new Date('2026-10-31T11:50:00Z'), 46.249891, -1.496728);
  check('solar noon is due south', near(noon.azimuth, 180, 0.5) && noon.elevation > sun.elevation, noon.azimuth.toFixed(2));
  const night = solarPosition(new Date('2026-10-31T19:00:00Z'), 46.249891, -1.496728);
  check('sun is down at 20:00', night.elevation < 0, night.elevation.toFixed(1));
  const june = solarPosition(new Date('2026-06-21T12:00:00Z'), 46.249891, -1.496728);
  check('midsummer sun is high', june.elevation > 65, june.elevation.toFixed(1));
  const v = sunVector(HALLOWEEN_NOON, 46.249891, -1.496728);
  check('sun vector points south and up', v[2] < -0.8 && v[1] > 0.4 && v[0] > 0 && near(Math.hypot(...v), 1, 1e-9), JSON.stringify(v));

  // Site: alley frame round trip and real walls about 3 m apart near the body.
  const site = await loadSite();
  const [e, n] = site.frame.toSite(10, 0.5);
  const [x, z] = site.frame.toAlley(e, n);
  check('alley frame round trip', near(x, 10, 1e-9) && near(z, 0.5, 1e-9));
  check('alley runs about south', Math.abs(site.frame.along[1] + 1) < 0.01, JSON.stringify(site.frame.along));
  const sw = wallsFromSite(site);
  const gaps = [3, 5, 8, 12].map(xx => { const r = sw(xx, 1, 0), l = sw(xx, -1, 0); return r !== null && l !== null ? r - l : null; });
  check('walls found along the alley', gaps.every(g => g !== null), JSON.stringify(gaps));
  check('gap about 3 m along the used stretch', gaps.slice(1).every(g => g > 2.6 && g < 3.3), JSON.stringify(gaps));
  check('gap wider at the mouth', gaps[0] > gaps[1], JSON.stringify(gaps));
  const real = buildSpider(DEFAULTS, sw);
  check('real-site legs all placed', real.legs.every(l => l.status === 'ok'), real.legs.map(l => l.status).join(','));
  for (const l of real.legs) check(`real leg ${l.pair} foot on a building edge`, near(dist(l.knee, l.foot), l.b, 1e-9));
  out.push('gaps along the alley at x = 3, 5, 8, 12 m: ' + gaps.map(g => g.toFixed(2)).join(', '));
  // Walking collisions: inside the east house is blocked, the alley centre is free.
  check('inside a building is blocked', insideBuilding(site, 6.5, -8, 0.35));
  const [ce, cn] = site.frame.toSite(8, 0);
  check('alley centre is free', !insideBuilding(site, ce, cn, 0.35));
  const [we, wn] = site.frame.toSite(8, sw(8, 1, 0) - 0.1);
  check('10 cm from a wall is blocked', insideBuilding(site, we, wn, 0.35));
} catch (err) {
  failed++;
  out.push('ERROR ' + (err.stack || err));
}
out.push(failed ? `${failed} FAILED` : 'ALL PASSED');
document.getElementById('out').textContent = out.join('\n');
document.title = failed ? 'FAILED' : 'PASSED';
</script></body></html>
