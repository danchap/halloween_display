<!doctype html><html><head><meta charset="utf-8"><title>sample</title></head><body><pre id="out">loading</pre>
<script>
// Average colours over a grid of the photo, for picking material colours.
const img = new Image();
img.src = '../site/photos/trousse-chemise-east.jpg';
img.onload = () => {
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = 300; c.height = Math.round(300 * H / W);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const cols = 10, rows = 14, lines = [`size ${W}x${H}`];
  const cw = c.width / cols, ch = c.height / rows;
  for (let r = 0; r < rows; r++) {
    let line = (r / rows).toFixed(2) + ' ';
    for (let k = 0; k < cols; k++) {
      let R = 0, G = 0, B = 0, n = 0;
      for (let y = Math.floor(r * ch); y < Math.floor((r + 1) * ch); y++) for (let x = Math.floor(k * cw); x < Math.floor((k + 1) * cw); x++) { const i = (y * c.width + x) * 4; R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
      const h = v => Math.round(v / n).toString(16).padStart(2, '0');
      line += h(R) + h(G) + h(B) + ' ';
    }
    lines.push(line);
  }
  // Specific patches, as fractions of width/height: [x0,y0,x1,y1]
  const patches = { sunWall: [0.92, 0.30, 0.99, 0.36], shadeWall: [0.02, 0.60, 0.06, 0.70], plinthLeft: [0.0, 0.76, 0.04, 0.79],
    roof: [0.55, 0.255, 0.80, 0.275], shutter: [0.335, 0.40, 0.36, 0.46], lane: [0.45, 0.85, 0.65, 0.95], setts: [0.37, 0.86, 0.46, 0.96],
    laneRight: [0.70, 0.80, 0.85, 0.90], pavementLeft: [0.0, 0.86, 0.04, 0.95], plinthRight: [0.86, 0.74, 0.93, 0.76], sky: [0.3, 0.05, 0.6, 0.15], plaque: [0.92, 0.385, 0.99, 0.42] };
  for (const [name, [x0, y0, x1, y1]] of Object.entries(patches)) {
    let R = 0, G = 0, B = 0, n = 0;
    for (let y = Math.floor(y0 * c.height); y < Math.floor(y1 * c.height); y++) for (let x = Math.floor(x0 * c.width); x < Math.floor(x1 * c.width); x++) { const i = (y * c.width + x) * 4; R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
    const h = v => Math.round(v / n).toString(16).padStart(2, '0');
    lines.push(name + ' ' + h(R) + h(G) + h(B));
  }
  document.getElementById('out').textContent = lines.join('\n'); document.title = 'done';
};
</script></body></html>
