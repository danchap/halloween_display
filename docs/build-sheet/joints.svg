<text x="121" y="236" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="133" y="236" font-size="12" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">hip turn</text>
