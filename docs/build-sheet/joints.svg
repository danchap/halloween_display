<text x="638" y="68" font-size="12">up</text>
<circle cx="630" cy="132" r="7" fill="#fff" stroke="#000" stroke-width="1.2"/>
<circle cx="630" cy="132" r="2" fill="#000" stroke="none" stroke-width="1"/>
<text x="642" y="136" font-size="12">toward the head and the street:</text>
<text x="642" y="150" font-size="12">out of the page, toward you</text>
<circle cx="32" cy="404" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="408" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="48" y="408" font-size="12">hip angle: between the stub and the upper</text>
<circle cx="32" cy="424" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="428" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="48" y="428" font-size="12">hip turn: the upper’s plane turned about the stub, 0 = toward the head, positive = up</text>
<circle cx="32" cy="444" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="448" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="48" y="448" font-size="12">knee bend: the lower turned off the upper’s line</text>
<circle cx="32" cy="464" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="468" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="48" y="468" font-size="12">knee roll: the knee’s plane turned about the upper, from the hip’s plane, positive = clockwise seen from the</text>
<text x="48" y="485" font-size="12">hip looking toward the knee</text>
<circle cx="32" cy="501" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="505" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
<text x="48" y="505" font-size="12">foot bend: between the lower and the post</text>
<circle cx="32" cy="521" r="8" fill="#000" stroke="none" stroke-width="1"/>
<text x="32" y="525" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">6</text>
<text x="48" y="525" font-size="12">foot roll: the foot’s plane about the lower, from the knee’s plane, same sense</text>
<text x="24" y="580" font-size="11.5" fill="#666">The three joints are drawn in one plane; the turns move them out of it. Each ring arrow shows the positive sense of its turn, as seen from this side.</text>
</svg>
