<text x="278.53" y="248.33" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="290.53" y="248.33" font-size="12" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">hip angle</text>
